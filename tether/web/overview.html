<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tether</title>
<meta name="description" content="Tether ties a simulator to the real world: from a phone video or the logs a robot, car or production line already writes, it finds which physics the simulator gets wrong, how sure that is, and exports configs for NVIDIA Newton, Isaac Lab and CARLA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tether Overview. Same tool language as the Benchmark page and Studio (docs/design/REFERENCE.md): dark surfaces, square corners,
   green only for "calibrated / verified". The one loud element is the tether itself: the simulator's predicted stops
   pulled onto the real ones, drawn from a recorded run. */
/*__SHARED_CSS__*/
body { line-height: 1.55; }
a { color: inherit; }
.tbar .brand .sub { font-family: var(--f-body); font-size: 13px; }

main { max-width: 1240px; margin: 0 auto; padding: 0 32px 64px; }
section { padding-block: 44px; border-bottom: 1px solid var(--line-soft); }
section:last-child { border-bottom: 0; }
.kicker { font: 600 13px/1 var(--f-display); letter-spacing: 0.06em; color: var(--green); }
h2.sec { font-size: 30px; margin-top: 8px; }
.lede { color: var(--muted); font-size: 16px; max-width: 70ch; margin-top: 10px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 48px; align-items: center; padding-block: 72px 64px; }
.hero h2 { font-size: clamp(38px, 5vw, 58px); line-height: 1.02; letter-spacing: -0.005em; }
.hero .lede { font-size: 17px; margin-top: 18px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.made { margin-top: 22px; color: var(--dim); font-size: 13px; }
.link { color: var(--muted); font: 600 15px/1 var(--f-display); text-decoration: none; padding: 11px 6px; }
.link:hover { color: var(--fg); }
a.dom { text-decoration: none; color: inherit; }
a.dom:hover { border-color: var(--green); }
.dom .go { margin-top: auto; padding-top: 6px; font: 600 15px/1 var(--f-display); color: var(--green); }
.note { margin-top: 14px; color: var(--dim); font-size: 13px; }
.note a { color: var(--fg); font-weight: 600; text-underline-offset: 3px; }

/* the tether */
.tether { background: var(--panel); border: 1px solid var(--line); padding: 18px 18px 12px; }
.tether .hd { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.tether .hd b { font: 600 16px/1.2 var(--f-display); }
.tether .hd span { color: var(--dim); font-size: 12.5px; }
.tether svg { display: block; width: 100%; height: auto; margin-top: 10px; }
.tether svg text { fill: var(--muted); font: 12px var(--f-body); }
.tether svg .lab { font: 600 12px var(--f-display); letter-spacing: 0.06em; }
.tether .ft { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.tether .ft i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.tether .toggle { display: flex; border: 1px solid var(--line); }
.tether .toggle button { all: unset; cursor: pointer; padding: 5px 10px; font: 600 12.5px/1 var(--f-display); color: var(--muted); }
.tether .toggle button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: inset 0 -2px 0 var(--green); }
.mk { transition: transform 900ms cubic-bezier(.2,.7,.2,1); }
.tl { transition: all 900ms cubic-bezier(.2,.7,.2,1); }

/* route: Overview -> Studio (your data) or Benchmark (how the AI is tested) */
.route { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 24px; border: 1px solid var(--line); }
.route a { display: grid; gap: 6px; align-content: start; padding: 20px 22px 22px; text-decoration: none; border-right: 1px solid var(--line); background: var(--panel); position: relative; }
.route a:last-child { border-right: 0; }
.route a:hover { background: var(--raised); }
.route .n { font: 600 13px/1 var(--f-mono); color: var(--green); }
.route h3 { font-size: 22px; }
.route p { color: var(--muted); font-size: 14.5px; }
.route .go { margin-top: 8px; font: 600 14px/1 var(--f-display); color: var(--fg); letter-spacing: 0.03em; }
.route a:not(:last-child)::after { content: ""; position: absolute; right: -7px; top: 28px; width: 12px; height: 12px; background: var(--bg); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: rotate(45deg); z-index: 1; }

/* domains */
.doms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.dom { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.dom .img { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; border-bottom: 1px solid var(--line); position: relative; }
.dom .img span { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,0.78); padding: 3px 8px; font-size: 12px; color: var(--muted); }
.dom .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.dom h3 { font-size: 23px; }
.dom p { color: var(--muted); font-size: 14.5px; }
.dom dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 4px 0 0; font-size: 13.5px; }
.dom dt { color: var(--dim); }
.dom dd { margin: 0; }
.dom .res { border-left: 2px solid var(--green); padding: 6px 10px; background: var(--green-wash); font-size: 13.5px; }
.dom .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
.dom .acts a { padding: 9px 13px; font-size: 14px; }

/* under the hood */
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 24px; border-top: 2px solid var(--green); }
.pipe div { padding: 16px 16px 4px 0; display: grid; gap: 6px; align-content: start; }
.pipe div + div { padding-left: 16px; border-left: 1px solid var(--line-soft); }
.pipe b { font: 600 18px/1.2 var(--f-display); }
.pipe .n { font: 500 12px/1 var(--f-mono); color: var(--green); }
.pipe p { color: var(--muted); font-size: 13.5px; }
.pipe code { font: 12px/1.4 var(--f-mono); color: var(--fg); }

/* evidence */
.ev { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.ev div { border-top: 2px solid var(--green); padding: 18px 4px 0; display: grid; gap: 8px; align-content: start; }
.ev .big { font: 600 52px/1 var(--f-display); }
.ev .big small { font-size: 20px; color: var(--muted); font-weight: 500; }
.ev .big em { font-style: normal; color: var(--green); }
.ev p { color: var(--muted); font-size: 14px; }
.ev .src { color: var(--dim); font-size: 12.5px; }

.stack { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.stack span { border: 1px solid var(--line); padding: 7px 11px; font-size: 13.5px; color: var(--muted); }
.stack span b { color: var(--fg); font-weight: 600; }
footer { color: var(--dim); font-size: 13px; padding: 26px 32px 40px; max-width: 1240px; margin: 0 auto; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; }
  .doms { grid-template-columns: 1fr; }
  .ev { grid-template-columns: 1fr 1fr; }
  .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pipe div + div { border-left: 0; padding-left: 0; }
}
@media (max-width: 640px) {
  main { padding: 0 16px 48px; }
  footer { padding-inline: 16px; }
  .status { display: none; }
  .route { grid-template-columns: 1fr; }
  .route a { border-right: 0; border-bottom: 1px solid var(--line); }
  .route a::after { display: none; }
  .pipe { grid-template-columns: 1fr; }
  .ev { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .mk, .tl { transition: none; } }
</style>
</head>
<body>
<header class="tbar">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 22 14" aria-hidden="true"><rect x="0" y="0" width="6" height="6" fill="#6e6e6e"/><rect x="16" y="8" width="6" height="6" fill="#76b900"/><path d="M3 6 L19 8" stroke="#76b900" stroke-width="1.6"/></svg><b>Tether</b><span class="sub" id="tagline">Sim-to-real calibration</span></a>
  <nav class="tnav" aria-label="Tether">
    <a href="/" aria-current="page" id="n-home">Overview</a>
    <a href="/studio" id="n-studio">Studio</a>
    <a href="/benchmark" id="n-benchmark">Benchmark</a>
  </nav>
  <div class="tslot">
    <div class="status" id="status"><i></i><span>…</span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ko">KO</button></div>
  </div>
</header>
<main id="main"></main>
<footer><div id="foot"></div><div class="stack" id="stack"></div></footer>

<script>
let LANG = (() => { const q = new URLSearchParams(location.search).get("lang"); if (q === "ko" || q === "en") return q;
  try { return localStorage.getItem("tether-lang") || "en"; } catch (_) { return "en"; } })();
const T = (en, ko) => (LANG === "ko" ? ko : en);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Shared-page build (tether/web/build.py) injects the published Benchmark/Studio links and the Newton stills; on the live
   server this stays null and the page uses its own routes. Shared pages can only pass a #domain, not ?sample=. */
const STATIC = /*__HOME_STATIC__*/null;
const L = {
  benchmark: q => STATIC ? STATIC.benchmark : `/benchmark${q}`,
  studio: (q, hash = "", sample = "") => STATIC ? STATIC.studio + (hash ? "#" + hash : "") : `/studio${sample ? (q ? q + "&" : "?") + "sample=" + sample : q}${hash ? "#" + hash : ""}`,
  img: id => STATIC ? STATIC.img[id] : `/api/studio/sample-frame/${id}`,
};

/* The roadside braking example as recorded (runs/studio-demo/stop-line.json, first take): for each run, where the car
   really stopped, where the uncalibrated simulator says it would, and where Tether's calibrated simulator says it would.
   Metres and km/h at full scale. */
const TETHER = [[2.43, 2.09, 2.26, 21], [3.79, 3.5, 3.79, 27], [4.69, 4.33, 4.69, 30], [5.39, 5.02, 5.43, 32], [6.85, 6.36, 6.88, 36], [8.56, 7.85, 8.6, 40], [13.22, 9.51, 13.0, 44]];
let calibrated = false;

const DOMAINS = [
  { id: "robot", sample: "flick", img: "flick", name: ["Robot manipulation", "로봇 조작"],
    line: ["An arm pushes a box onto a line.", "로봇 팔로 상자를 목표선에 세웁니다."],
    data: ["Phone video (A4 sheet for scale) or the robot's push log", "스마트폰 영상(A4 용지를 크기 기준으로 사용) 또는 로봇 로그"],
    finds: ["Table friction, a wet patch, arm strength, camera tilt", "탁자 마찰계수, 젖은 구간, 팔 출력, 카메라 기울기"],
    out: "Newton · Isaac Lab", res: ["Robot log, 20 pushes: friction 0.696 (truth 0.70), arm 0.872× (0.88), patch from 0.376 m (0.38)", "로봇 로그 20회 분석: 마찰계수 0.696(실제 0.70), 팔 출력 0.872배(실제 0.88), 0.376 m 지점부터 마찰이 다른 구간(실제 0.38 m)"] },
  { id: "driving", sample: "stop-line", img: "stop-line", name: ["Autonomous vehicles", "자율주행 차량"],
    line: ["A car brakes to stop on the line.", "차량을 정지선에 맞춰 세웁니다."],
    data: ["Roadside video or a vehicle log (speed set-point, stop position, camera range)", "도로변 촬영 영상 또는 차량 로그(목표 속도, 정지 위치, 카메라 측정 거리)"],
    finds: ["Tire-road friction, a wet section, speed control, camera pitch", "타이어-노면 마찰계수, 젖은 구간, 속도 추종 오차, 카메라 기울기"],
    out: "Newton · CARLA · Isaac Lab", res: ["Roadside video, 11 runs: road μ 0.738 (truth 0.75), wet from 8.78 m (8.82), wet μ 0.274 (0.30)", "도로변 영상 11회 분석: 노면 마찰계수 0.738(실제 0.75), 젖은 구간 시작 8.78 m(실제 8.82 m), 젖은 구간 마찰계수 0.274(실제 0.30)"] },
  { id: "factory", sample: "press-line", img: "press-line", name: ["Factory inspection", "제조 검사"],
    line: ["A pusher sends parts to the inspection spot.", "푸셔로 부품을 검사 위치에 보냅니다."],
    data: ["Line camera video or the pusher's log", "라인 카메라 영상 또는 푸셔 로그"],
    finds: ["Part-rail friction, an oily section, pusher strength, camera tilt", "부품-레일 마찰계수, 기름이 묻은 구간, 푸셔 출력, 카메라 기울기"],
    out: "Newton · Isaac Lab", res: ["Pusher log, 18 strokes: friction 0.558 (truth 0.55), pusher 0.911× (0.92), camera −1.6° (−1.5°)", "푸셔 로그 18회 분석: 마찰계수 0.558(실제 0.55), 푸셔 출력 0.911배(실제 0.92), 카메라 기울기 −1.6°(실제 −1.5°)"] },
];

function tetherSvg() {
  const W = 620, H = 250, x0 = 60, x1 = W - 24, xmax = 14.5, X = m => x0 + m / xmax * (x1 - x0);
  const ySim = 70, yReal = 182;
  const rows = TETHER.map(([real, sim, cal, kmh], i) => {
    const s = calibrated ? cal : sim, off = Math.abs(s - real) > 0.4;
    const col = calibrated ? "#76b900" : off ? "#d9a13b" : "#a3a3a3";
    return `<line class="tl" x1="${X(s)}" y1="${ySim + 9}" x2="${X(real)}" y2="${yReal - 9}" stroke="${col}" stroke-width="${calibrated ? 1.6 : 1.2}" stroke-dasharray="${calibrated ? "0" : "4 4"}"/>
      <rect class="mk" x="${X(s) - 6}" y="${ySim - 7}" width="12" height="14" fill="${calibrated ? "#76b900" : "#6e6e6e"}"/>
      <rect x="${X(real) - 6}" y="${yReal - 7}" width="12" height="14" fill="#eeeeee"/>
      ${i === TETHER.length - 1 ? `<text x="${X(real) + 10}" y="${yReal + 4}">${kmh} km/h</text>` : ""}`;
  }).join("");
  const ticks = [0, 2, 4, 6, 8, 10, 12, 14].map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="${yReal + 16}" y2="${yReal + 21}" stroke="#333333"/><text x="${X(t)}" y="${yReal + 36}" text-anchor="middle">${t} m</text>`).join("");
  const wet = `<rect x="${X(8.82)}" y="${yReal - 16}" width="${X(14.5) - X(8.82)}" height="32" fill="rgba(76,181,230,0.16)"/><text x="${X(8.82) + 6}" y="${yReal - 22}" style="fill:#4cb5e6">${T("wet from 8.8 m", "8.8 m 지점부터 젖은 노면")}</text>`;
  const last = TETHER[TETHER.length - 1], s = calibrated ? last[2] : last[1];
  const gap = `<text x="${X(s)}" y="${ySim - 18}" text-anchor="middle" style="fill:${calibrated ? "#76b900" : "#d9a13b"};font-family:var(--f-mono)">${calibrated ? T(`${s.toFixed(1)} m (real ${last[0].toFixed(1)})`, `${s.toFixed(1)} m (실제 ${last[0].toFixed(1)})`) : T(`${s.toFixed(1)} m, ${(last[0] - s).toFixed(1)} m short`, `${s.toFixed(1)} m, ${(last[0] - s).toFixed(1)} m 모자람`)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T("Simulated stops tethered to real stops", "시뮬레이터가 예측한 정지 위치와 실제 정지 위치")}">
    <line x1="${x0}" x2="${x1}" y1="${ySim}" y2="${ySim}" stroke="#333333"/><line x1="${x0}" x2="${x1}" y1="${yReal}" y2="${yReal}" stroke="#333333"/>
    <text class="lab" x="0" y="${ySim + 4}">${T("SIM", "시뮬")}</text><text class="lab" x="0" y="${yReal + 4}">${T("REAL", "실제")}</text>
    ${wet}${rows}${gap}${ticks}</svg>`;
}
function renderTether() {
  $("#tsvg").innerHTML = tetherSvg();
  document.querySelectorAll("#ttog button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.v === "cal") === calibrated)));
  $("#tnote").textContent = calibrated
    ? T("Tether's calibrated simulator: every predicted stop lands on the real one, including the run that reached the wet section.", "Tether로 보정한 시뮬레이터: 젖은 구간까지 들어간 경우를 포함해 모든 정지 위치를 실제와 같게 예측합니다.")
    : T("Your current simulator: dry asphalt everywhere. It is close on short runs and 3.7 m short where the road is wet.", "보정 전 시뮬레이터: 도로 전체를 마른 아스팔트로 가정합니다. 짧은 제동은 거의 맞지만, 젖은 구간에서는 실제보다 3.7 m 앞에 선다고 예측합니다.");
}

function render() {
  document.documentElement.lang = LANG;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("#tagline").textContent = T("Sim-to-real calibration", "시뮬레이터를 현실에 맞추는 보정 도구");
  $("#n-home").textContent = T("Overview", "소개"); $("#n-benchmark").textContent = T("Benchmark", "검증");
  const q = LANG === "ko" ? "?lang=ko" : "";
  $("#main").innerHTML = `
  <section class="hero">
    <div>
      <h2>${T("Tie your simulator to the real world.", "시뮬레이터를 현실에 맞춥니다.")}</h2>
      <p class="lede">${T("Give Tether a video or a log of how things really slide and stop. It finds what your simulator gets wrong, says how sure it is, and retrains the policy on the corrected physics.", "실제 움직임이 담긴 영상이나 로그만 있으면 됩니다. Tether가 시뮬레이터의 어느 값이 틀렸는지 찾아 보정하고, 보정된 물리로 정책을 다시 학습합니다.")}</p>
      <div class="ctas"><a class="btn primary" href="${L.studio(q)}">${T("Start in Studio", "Studio에서 시작하기")}</a><a class="link" href="${L.benchmark(q)}">${T("See how the AI is tested", "AI 검증 보기")}</a></div>
    </div>
    <div class="tether">
      <div class="hd"><b>${T("Braking to a stop line", "정지선 제동")}</b>
        <div class="toggle" id="ttog" role="group" aria-label="${T("Simulator", "시뮬레이터")}"><button type="button" data-v="cur">${T("Before", "보정 전")}</button><button type="button" data-v="cal">${T("Tethered", "보정 후")}</button></div></div>
      <div id="tsvg"></div>
      <p class="ft" id="tnote"></p>
    </div>
  </section>

  <section>
    <h2 class="sec">${T("Pick your field", "분야를 고르세요")}</h2>
    <p class="lede">${T("One sliding-to-a-stop model covers all three.", "세 분야 모두 '미끄러지다 멈추는' 같은 물리 모델로 다룹니다.")}</p>
    <div class="doms">${DOMAINS.map(d => `<a class="dom" href="${L.studio(q, d.id, d.sample)}">
      <div class="img" style="background-image:url('${L.img(d.img)}')"></div>
      <div class="body"><h3>${T(...d.name)}</h3><p>${T(...d.line)}</p><span class="go">${STATIC ? T("Open in Studio", "Studio에서 열기") : T("Open the example", "예시 열기")}</span></div></a>`).join("")}</div>
  </section>

  <section>
    <h2 class="sec">${T("Results", "결과")}</h2>
    <div class="ev">
      <div><span class="big num"><em>96–100%</em></span><p>${T("hidden-world success after retraining on Tether's ranges, in 5 of 6 examples (before: 0–63%)", "Tether 범위로 재학습한 정책의 숨겨진 환경 성공률, 예시 6개 중 5개 (보정 전 0~63%)")}</p></div>
      <div><span class="big num"><em>89%</em></span><p>${T("success when the data comes from a different engine (MuJoCo, 24 worlds); the best domain randomization reaches 12%", "다른 물리 엔진(MuJoCo)이 만든 데이터로 보정했을 때의 성공률 (세계 24개, 가장 좋은 도메인 랜덤화는 12%)")}</p></div>
      <div><span class="big num"><em>${T("4 of 5", "5개 중 4개")}</em></span><p>${T("real objects whose friction Tether recovers within ±0.05 of a separate tilt test, from 30 Hz video (EV-RealPhys benchmark)", "실제 물체 5개 중 4개: 따로 잰 기울기 시험 값과 ±0.05 이내 (30 Hz 영상, EV-RealPhys 벤치마크)")}</p></div>
    </div>
    <p class="note">${T("The first two use simulated worlds whose truth is known (NVIDIA Newton, and MuJoCo as a second engine); the third is a public real-world benchmark. `make prove` recomputes every number.", "앞의 두 수치는 실제값을 아는 가상 세계(NVIDIA Newton, 다른 엔진 MuJoCo), 세 번째는 공개 실제 데이터 벤치마크입니다. 모든 수치는 `make prove`로 다시 계산할 수 있습니다.")}</p>
    <p class="note">${T("Watch the AI find hidden causes step by step, and see how it compares with four other methods:", "AI가 숨은 원인을 찾는 과정과 다른 네 가지 방법과의 비교는 여기에서 봅니다:")} <a href="${L.benchmark(q)}">${T("Benchmark", "검증")}</a></p>
  </section>`;
  $("#foot").textContent = "Tether · NVIDIA Newton · NVIDIA Nemotron on Nebius Token Factory";
  document.querySelectorAll("#ttog button").forEach(b => b.onclick = () => { calibrated = b.dataset.v === "cal"; renderTether(); });
  renderTether();
  renderStack();
}
let STATUS = {};
function renderStack() {
  const on = STATUS.provider && STATUS.provider !== "none";
  $("#stack").innerHTML = [["NVIDIA Newton", T("physics and rendering (Warp)", "물리 시뮬레이션·렌더링 (Warp)")], ["NVIDIA Nemotron 3 Super 120B", STATUS.recorded ? T("on Nebius Token Factory (recorded runs)", "Nebius Token Factory (실행 기록 재생)") : on ? T("live on Nebius Token Factory", "Nebius Token Factory 연결됨") : T("off on this server", "이 서버에서는 꺼져 있음")], ["NVIDIA NeMo Agent Toolkit", T("the agent as a workflow (nat run)", "AI 에이전트를 워크플로로 실행 (nat run)")], ["NVIDIA Cosmos Reason 2", T("optional, local: tipped or not", "선택 사항, 로컬 실행: 넘어짐 판정")], ["Isaac Lab · CARLA", T("export targets", "내보내기 형식")]]
    .map(([a, b]) => `<span><b>${a}</b> · ${b}</span>`).join("");
  const st = $("#status"); st.classList.toggle("off", !on);
  st.querySelector("span").textContent = STATUS.recorded ? T("Recorded runs: Nemotron 3 Super", "Nemotron 3 Super 실행 기록 재생")
    : on ? T("Agent online: Nemotron 3 Super", "AI 연결됨: Nemotron 3 Super") : T("Agent off: offline fitting", "AI 꺼짐: 계산 방식만 사용");
}
function setLang(l) { LANG = l; try { localStorage.setItem("tether-lang", l); } catch (_) {} render(); }
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
if (STATIC) { $("#n-benchmark").href = STATIC.benchmark; $("#n-studio").href = STATIC.studio; document.querySelector(".brand").removeAttribute("href"); $("#n-home").removeAttribute("href"); }
render();
if (!reduce) setTimeout(() => { calibrated = true; renderTether(); }, 1400);  // one orchestrated moment: the tether pulls tight
(STATIC ? Promise.resolve({ provider: "tokenfactory", recorded: true }) : fetch("/api/status").then(r => r.json())).then(s => { STATUS = s; renderStack(); }).catch(() => renderStack());
</script>
