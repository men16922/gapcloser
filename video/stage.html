<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tether film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
/* Tether film: one 1920x1080 stage, drawn at time t by render(scene, t). Near-black, NVIDIA green as the only accent,
   the tether (a hollow square tied to a filled one) as the motif that carries from scene to scene. */
:root {
  --bg: #000; --ink: #f2f2f2; --mute: #9a9a9a; --dim: #5a5a5a; --line: #262626;
  --green: #76b900; --green-hi: #9bd431; --amber: #e6a23c; --slick: #4cb5e6;
  --f-d: "Barlow Semi Condensed", "Arial Narrow", sans-serif; --f-b: "Barlow", Arial, sans-serif; --f-m: "IBM Plex Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; color: var(--ink); font-family: var(--f-b); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
.scene { position: absolute; inset: 0; }
.abs { position: absolute; }
.h1 { font: 700 132px/0.96 var(--f-d); letter-spacing: -0.012em; }
.h2 { font: 700 84px/1.0 var(--f-d); letter-spacing: -0.008em; }
.h3 { font: 600 44px/1.15 var(--f-d); letter-spacing: 0.004em; }
.lede { font: 400 34px/1.42 var(--f-b); color: var(--mute); }
.mono { font-family: var(--f-m); }
.lab { font: 500 22px/1 var(--f-m); color: var(--mute); letter-spacing: 0.02em; }
.g { color: var(--green); }
.reveal { display: block; overflow: hidden; }
.reveal > span { display: inline-block; will-change: transform; }
.frame { position: absolute; overflow: hidden; border: 1px solid #333; background: #0b0b0b; }
.frame img { position: absolute; transform-origin: 0 0; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
.grain { position: absolute; inset: -40px; pointer-events: none; opacity: 0.06; mix-blend-mode: screen; }
.bar { position: absolute; left: 0; right: 0; height: 138px; background: #000; }
.card { position: absolute; background: #0d0d0d; border: 1px solid #2c2c2c; }
.row { display: grid; grid-template-columns: 300px 160px 160px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #1f1f1f; }
.step { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: 28px 1fr; column-gap: 22px; }
.step i { width: 14px; height: 14px; margin-top: 12px; background: var(--green); display: block; }
.step b { font: 600 34px/1.2 var(--f-d); display: block; }
.step small { font: 400 24px/1.4 var(--f-m); color: var(--mute); display: block; margin-top: 6px; }
pre.code { font: 400 23px/1.5 var(--f-m); color: #d6d6d6; white-space: pre; }
pre.code .k { color: var(--green); } pre.code .c { color: #6f6f6f; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const DATA = /*__DATA__*/null;
const S = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, e5 = x => 1 - Math.pow(1 - x, 5);
const lerp = (a, b, x) => a + (b - a) * x;
const pad = n => String(n).padStart(4, "0");
let cur = null, els = {};

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function put(html, css) { const e = el(html); if (css) Object.assign(e.style, css); cur.appendChild(e); return e; }
// a line of text that slides up out of a mask
function line(text, cls, x, y, extra = {}) {
  const e = put(`<div class="abs reveal ${cls}"><span>${text}</span></div>`, { left: x + "px", top: y + "px", ...extra });
  return e;
}
function rise(e, t, a, dur = 0.7) { const p = e5(P(t, a, a + dur)); e.firstChild.style.transform = `translateY(${(1 - p) * 110}%)`; e.style.opacity = p > 0 ? 1 : 0; }
function fade(e, t, a, dur = 0.6) { e.style.opacity = eo(P(t, a, a + dur)); }
function imgLoad(img, src) { if (img.getAttribute("src") !== src) { img.src = src; } return img.decode().catch(() => {}); }
function grain(t) { // a static noise tile, shifted each frame
  if (!els.grain) { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); const im = g.createImageData(256, 256);
    let s = 7; for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s % 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); els.grainURL = c.toDataURL(); }
  const e = put(`<div class="grain"></div>`, { backgroundImage: `url(${els.grainURL})` });
  // static: a texture on the black, not flicker (moving grain would also make the file ten times bigger)
}
// the tether mark: hollow square (simulator) tied to a filled one (real world)
function mark(x, y, size, gap, p, color = "var(--green)") {
  const w = size, L = gap * p;
  return `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="${2 * w + gap}" height="${w * 2}">
    <rect x="1.5" y="1.5" width="${w - 3}" height="${w - 3}" fill="none" stroke="#8a8a8a" stroke-width="3"/>
    <line x1="${w}" y1="${w * 0.5}" x2="${w + L}" y2="${w * 0.5 + (w) * 0.5 * p}" stroke="${color}" stroke-width="4"/>
    <rect x="${w + gap}" y="${w * 0.5}" width="${w}" height="${w}" fill="${color}" opacity="${p}"/></svg>`;
}

/* ------------------------------------------------------------------ scenes (t in seconds, d = scene length) */
const SCENES = {
  async cold(t, d) {
    const k = clamp(Math.floor((t - 0.6) * 14), 0, DATA.mug.n - 1);
    const img = put(`<img class="abs">`, { left: "-60px", top: "0px", width: "2040px", height: "1150px", objectFit: "cover",
      filter: "brightness(0.62) saturate(0.85) contrast(1.05)", transform: `scale(${lerp(1.08, 1.0, eio(P(t, 0, d)))})`, transformOrigin: "60% 55%" });
    await imgLoad(img, DATA.mug.path(k));
    put(`<div class="vignette"></div>`);
    put(`<div class="bar"></div>`, { top: 0 }); put(`<div class="bar"></div>`, { bottom: 0 });
    const a = line("Every robot learns in a simulator first.", "h3", 140, 760); rise(a, t, 0.7);
    const b = line("Then it meets the real world.", "h3", 140, 820, { color: "var(--ink)" }); rise(b, t, 3.0);
    const c = put(`<div class="abs lab">EV-RealPhys benchmark · a real table, 30 Hz</div>`, { right: "140px", top: "896px" }); fade(c, t, 1.2);
  },
  async gap(t, d) {
    const L = 230, R = 1690, X = m => L + (R - L) * m / 0.75, ys = 430, yr = 730, tgt = 0.45;
    const h = line("Same policy. Different physics.", "h2", 140, 120); rise(h, t, 0.2);
    let svg = `<svg class="abs" style="left:0;top:0" width="1920" height="1080">`;
    for (const [y, name] of [[ys, "Simulator"], [yr, "Real world"]]) {
      svg += `<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="#2e2e2e" stroke-width="2"/>`;
      svg += `<text x="${L}" y="${y - 54}" fill="#9a9a9a" font-family="IBM Plex Mono" font-size="24">${name}</text>`;
    }
    const xt = X(tgt);
    svg += `<rect x="${X(tgt - 0.03)}" y="${ys - 60}" width="${X(tgt + 0.03) - X(tgt - 0.03)}" height="${yr - ys + 120}" fill="rgba(118,185,0,0.10)"/>`;
    svg += `<line x1="${xt}" x2="${xt}" y1="${ys - 60}" y2="${yr + 60}" stroke="#76b900" stroke-width="3"/>`;
    svg += `<text x="${xt + 12}" y="${yr + 56}" fill="#76b900" font-family="IBM Plex Mono" font-size="22">target</text>`;
    const pushes = DATA.gap; let simOk = 0, realOk = 0;
    pushes.forEach((p, i) => {
      const t0 = 1.4 + i * 0.28, q = eo(P(t, t0, t0 + 1.1));
      if (q <= 0) return;
      const xs = X(p.sim * q), xr = X(p.real * q);
      const done = q >= 1;
      const okS = Math.abs(p.sim - tgt) <= 0.03, okR = Math.abs(p.real - tgt) <= 0.03;
      if (done) { simOk += okS; realOk += okR; }
      svg += `<rect x="${xs - 9}" y="${ys - 9 + (i % 3 - 1) * 14}" width="18" height="18" fill="${done ? (okS ? "#76b900" : "#e6a23c") : "#cfcfcf"}"/>`;
      svg += `<rect x="${xr - 9}" y="${yr - 9 + (i % 3 - 1) * 14}" width="18" height="18" fill="${done ? (okR ? "#76b900" : "#e6a23c") : "#cfcfcf"}"/>`;
    });
    svg += `</svg>`;
    put(svg);
    const n = pushes.length;
    const cs = put(`<div class="abs mono" style="font-size:40px;white-space:nowrap">${simOk}/${n} <span style="color:#9a9a9a;font-size:24px">on target</span></div>`, { left: "1560px", top: ys - 90 + "px" });
    const cr = put(`<div class="abs mono" style="font-size:40px;white-space:nowrap;color:${realOk ? "#f2f2f2" : "#e6a23c"}">${realOk}/${n} <span style="color:#9a9a9a;font-size:24px">on target</span></div>`, { left: "1560px", top: yr - 90 + "px" });
    fade(cs, t, 1.4); fade(cr, t, 1.4);
    const f = line("Slipperier table. Weaker motor. Nobody wrote it down.", "lede", 140, 900); rise(f, t, d - 4.6);
  },
  async title(t, d) {
    const p = eio(P(t, 0.3, 1.8));
    put(mark(760, 330, 120, 160, p));
    const a = line("Tether", "h1", 760, 520, { fontSize: "190px" }); rise(a, t, 1.4, 0.9);
    const b = line("Tie your simulator to the real world.", "h3", 762, 730, { color: "var(--mute)" }); rise(b, t, 2.2);
  },
  async input(t, d) {
    const fw = 1120, fh = 630, fx = 680, fy = 220, sc = fw / DATA.road.w;
    const fr = put(`<div class="frame"></div>`, { left: fx + "px", top: fy + "px", width: fw + "px", height: fh + "px" });
    const k = clamp(Math.floor(t * 30 * 0.9), 0, DATA.road.n - 1);
    const img = el(`<img>`); Object.assign(img.style, { left: 0, top: 0, width: fw + "px", height: fh + "px" }); fr.appendChild(img);
    await imgLoad(img, DATA.road.path(k));
    // the reference box, then each push's path as the video plays
    let svg = `<svg class="abs" style="left:0;top:0" width="${fw}" height="${fh}">`;
    const pc = eo(P(t, 0.8, 2.0));
    if (pc > 0) {
      const c = DATA.road.corners.map(([x, y]) => [x * sc, y * sc]);
      const pts = c.concat([c[0]]); let len = 0; const seg = [];
      for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); len += l; }
      svg += `<polyline points="${pts.map(q => q.join(",")).join(" ")}" fill="rgba(118,185,0,${0.14 * pc})" stroke="#76b900" stroke-width="3" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - pc)}"/>`;
    }
    for (const p of DATA.road.pushes) {
      const f0 = p.release_frame, f1 = p.rest_frame, fNow = k;
      if (fNow < f0) continue;
      const m = Math.min(p.path.length, Math.max(2, Math.ceil((fNow - f0) / 2) + 1));
      const pts = p.path.slice(0, m).map(([x, y]) => `${x * sc},${y * sc}`).join(" ");
      svg += `<polyline points="${pts}" fill="none" stroke="#76b900" stroke-width="4" stroke-linecap="round"/>`;
      if (fNow >= f1) { const [x, y] = p.path[p.path.length - 1]; svg += `<circle cx="${x * sc}" cy="${y * sc}" r="7" fill="#f2f2f2"/>`; }
    }
    svg += `</svg>`; fr.appendChild(el(svg));
    const a = line("A phone video,", "h2", 140, 250); rise(a, t, 0.3);
    const b = line("or the log your", "h2", 140, 340); rise(b, t, 0.6);
    const c = line("robot already writes.", "h2", 140, 430); rise(c, t, 0.9);
    const n1 = line("A box of known size gives the scale.", "lede", 140, 600); rise(n1, t, 2.2);
    const n2 = line("Every push is tracked to a stop.", "lede", 140, 652); rise(n2, t, 3.4);
    const cap = put(`<div class="abs lab">roadside camera, braking to a stop line · rendered by NVIDIA Newton</div>`, { left: fx + "px", top: fy + fh + 22 + "px" }); fade(cap, t, 1);
  },
  async reason(t, d) {
    const a = line("Nemotron reads", "h2", 140, 230); rise(a, t, 0.2);
    const b = line("the evidence.", "h2", 140, 320); rise(b, t, 0.5);
    const n = line("The numbers come from least squares,", "lede", 140, 470); rise(n, t, 1.4);
    const n2 = line("each with an honest interval.", "lede", 140, 520); rise(n2, t, 1.6);
    const card = put(`<div class="card"></div>`, { left: "860px", top: "170px", width: "920px", height: "740px" });
    fade(card, t, 0.4);
    card.appendChild(el(`<div class="abs lab" style="left:40px;top:34px">NVIDIA Nemotron 3 Super · tool calls · vehicle braking log</div>`));
    const steps = DATA.reason; const gapS = (d - 3.5) / steps.length;
    steps.forEach((s, i) => {
      const t0 = 1.0 + i * gapS;
      const st = el(`<div class="step"><i></i><div><b><span class="mono" style="font-size:26px;color:#76b900">${s.tool}</span>&nbsp;&nbsp;${s.what}</b><small>${s.detail}</small></div></div>`);
      Object.assign(st.style, { left: "40px", right: "40px", top: 100 + i * 124 + "px", opacity: eo(P(t, t0, t0 + 0.5)), transform: `translateY(${(1 - eo(P(t, t0, t0 + 0.5))) * 18}px)` });
      card.appendChild(st);
      if (s.bars && P(t, t0, t0 + 0.5) > 0) { // the deceleration profile, growing
        let svg = `<svg class="abs" style="left:600px;top:${104 + i * 124}px" width="260" height="70">`;
        const mx = Math.max(...s.bars);
        s.bars.forEach((v, j) => { const hh = 60 * v / mx * eo(P(t, t0 + 0.2 + j * 0.04, t0 + 0.8 + j * 0.04));
          svg += `<rect x="${j * (240 / s.bars.length)}" y="${64 - hh}" width="${240 / s.bars.length - 4}" height="${hh}" fill="${v / mx < 0.7 ? "#4cb5e6" : "#8a8a8a"}"/>`; });
        card.appendChild(el(svg + `</svg>`));
      }
    });
  },
  async result(t, d) {
    // the measured road from the Studio's results, framed alone, the camera easing in on the slick section
    const C = DATA.result.crop, fw = 1040, fh = Math.round(fw * C.h / C.w), fx = 780, fy = 230;
    const fr = put(`<div class="frame"></div>`, { left: fx + "px", top: fy + "px", width: fw + "px", height: fh + "px" });
    const img = el(`<img>`); fr.appendChild(img);
    const z = lerp(1.0, 1.22, eio(P(t, 0.6, d))), cw = C.w / z, ch = C.h / z;
    const cx = lerp(C.x + C.w / 2, C.fx, eio(P(t, 0.6, d))), cy = lerp(C.y + C.h / 2, C.fy, eio(P(t, 0.6, d)));
    const x0 = clamp(cx - cw / 2, C.x, C.x + C.w - cw), y0 = clamp(cy - ch / 2, C.y, C.y + C.h - ch), s = fw / cw;
    Object.assign(img.style, { width: DATA.result.w * s + "px", left: -x0 * s + "px", top: -y0 * s + "px" });
    await imgLoad(img, DATA.result.src);
    fade(fr, t, 0.2, 0.8);
    const cap = put(`<div class="abs lab">Tether Studio · the roadside example · friction mapped on the road</div>`, { left: fx + "px", top: fy + fh + 22 + "px" }); fade(cap, t, 1);
    const a = line("Your simulator,", "h2", 140, 230); rise(a, t, 0.3);
    const b = line("corrected.", "h2", 140, 320, { color: "var(--green)" }); rise(b, t, 0.6);
    DATA.result.facts.forEach((f, i) => { const e = line(f, "lede", 140, 470 + i * 46, { fontFamily: "var(--f-m)", fontSize: "22px", color: "#cfcfcf", whiteSpace: "pre" }); rise(e, t, 1.6 + i * 0.5); });
    const ex = line("Exports for NVIDIA Newton, Isaac Lab and CARLA", "lab", 140, 680, { fontSize: "22px", color: "var(--green)" }); rise(ex, t, d - 4.5);
  },
  async retrain(t, d) {
    const split = Math.min(d * 0.5, 7.5);
    if (t < split) {
      const k = clamp(Math.floor(t / split * (DATA.montage.n - 1)), 0, DATA.montage.n - 1);
      const fr = put(`<div class="frame"></div>`, { left: "140px", top: "250px", width: "1640px", height: "700px", border: "0" });
      const img = el(`<img>`); fr.appendChild(img);
      Object.assign(img.style, { width: "1792px", left: "-76px", top: "-90px" });  // the grid of worlds, without the old caption
      await imgLoad(img, DATA.montage.path(k));
      const a = line("Sixteen parallel NVIDIA Newton worlds,", "h3", 140, 110); rise(a, t, 0.2);
      const b = line("drawn from what Tether measured.", "h3", 140, 166, { color: "var(--mute)" }); rise(b, t, 0.5);
      const it = Math.min(10, Math.floor(t / split * 11));
      put(`<div class="abs lab" style="font-size:26px">training iteration ${it}</div>`, { right: "140px", top: "190px" });
    } else {
      const u = t - split, k = clamp(Math.floor(u * 30 * 0.8), 0, DATA.rollout.n - 1);
      const a = line("Then, the hidden world.", "h3", 140, 110); rise(a, u, 0.1);
      DATA.rollout.cols.forEach((c, i) => {
        const x = 140 + i * 560, w = 520;
        const fr = put(`<div class="frame"></div>`, { left: x + "px", top: "300px", width: w + "px", height: "290px" });
        const img = el(`<img>`); fr.appendChild(img);
        const s = w / c.w; Object.assign(img.style, { width: 1920 * s + "px", left: -c.x * s + "px", top: -c.y * s + "px" });
        imgLoad(img, DATA.rollout.path(k));
        const lab = put(`<div class="abs h3" style="font-size:34px;color:${i === 2 ? "#76b900" : "#cfcfcf"}">${c.label}</div>`, { left: x + "px", top: "620px" }); fade(lab, u, 0.3 + i * 0.15);
        const num = put(`<div class="abs" style="font:700 120px/1 var(--f-d);color:${i === 2 ? "#76b900" : "#f2f2f2"}">${Math.round(c.success * 100 * eo(P(u, 1.0 + i * 0.4, 2.2 + i * 0.4)))}%</div>`, { left: x + "px", top: "690px" });
        fade(num, u, 1.0 + i * 0.4, 0.3);
      });
      await Promise.all([...cur.querySelectorAll("img")].map(i => i.decode().catch(() => {})));
      const cap = put(`<div class="abs lab">success in the hidden world, 24 targets · rendered by NVIDIA Newton</div>`, { left: "140px", top: "860px" }); fade(cap, u, 2);
    }
  },
  async proofReal(t, d) {
    const img = put(`<img class="abs">`, { left: "0", top: "0", width: "1920px", height: "1080px", objectFit: "cover", filter: "brightness(0.28) saturate(0.6) blur(2px)" });
    await imgLoad(img, DATA.mug.path(DATA.mug.n - 1));
    put(`<div class="vignette"></div>`);
    const lbl = line("Real objects, real table, friction measured separately", "lab", 140, 180, { fontSize: "26px" }); rise(lbl, t, 0.2);
    const big = line(`${DATA.real.within} of ${DATA.real.objects}`, "h1", 140, 250, { fontSize: "220px", color: "var(--green)" }); rise(big, t, 0.6, 0.9);
    const sub = line("within ±0.05 of an independent tilt test", "h3", 146, 480); rise(sub, t, 1.2);
    const tb = put(`<div class="abs"></div>`, { left: "1080px", top: "220px", width: "640px" });
    tb.appendChild(el(`<div class="row lab" style="font-size:22px"><span>object</span><span>tilt test</span><span>Tether</span></div>`));
    DATA.real.rows.forEach((r, i) => {
      const e = el(`<div class="row mono" style="font-size:30px"><span>${r.object}</span><span>${r.truth.toFixed(3)}</span><span style="color:${r.ok ? "#76b900" : "#e6a23c"}">${r.tether.toFixed(3)}</span></div>`);
      e.style.opacity = eo(P(t, 1.6 + i * 0.35, 2.1 + i * 0.35)); tb.appendChild(e);
    });
    const foot = line(`mean error ${DATA.real.mae.toFixed(3)} · the paper's own estimator ${DATA.real.paper.toFixed(3)}`, "lede", 146, 600, { fontSize: "30px" }); rise(foot, t, 3.6);
    const src = put(`<div class="abs lab" style="font-size:20px;color:#6f6f6f">EV-RealPhys, Kandukuri, Strecke, Stückler 2023 (Max Planck Institute), CC BY-SA 4.0</div>`, { left: "140px", top: "960px" }); fade(src, t, 1);
  },
  async proofEngine(t, d) {
    const lbl = line("Hidden worlds built by a different engine (MuJoCo)", "lab", 140, 180, { fontSize: "26px" }); rise(lbl, t, 0.2);
    const H = 470, base = 860;
    DATA.engine.forEach((b, i) => {
      const x = 180 + i * 520, p = eo(P(t, 0.8 + i * 0.5, 2.3 + i * 0.5)), h = H * b.v * p;
      put(`<div class="abs" style="background:${b.hi ? "#76b900" : "#3a3a3a"}"></div>`, { left: x + "px", top: base - h + "px", width: "300px", height: h + "px" });
      const n = put(`<div class="abs" style="font:700 110px/1 var(--f-d);color:${b.hi ? "#76b900" : "#f2f2f2"}">${Math.round(b.v * 100 * p)}%</div>`, { left: x + "px", top: base - h - 128 + "px" }); fade(n, t, 0.8 + i * 0.5, 0.3);
      const l = put(`<div class="abs h3" style="font-size:32px;color:${b.hi ? "#f2f2f2" : "#9a9a9a"};width:420px">${b.label}</div>`, { left: x + "px", top: base + 24 + "px" }); fade(l, t, 0.8 + i * 0.5);
    });
  },
  async honest(t, d) {
    const a = line("The AI proposes.", "h2", 140, 260); rise(a, t, 0.2);

    const s1 = el(`<div class="abs" style="left:44px;top:50px;right:44px"><div class="lab">Nemotron proposes</div><div class="h3" style="margin-top:16px">a slick region from <span class="mono">0.25 m</span></div></div>`);
    card.appendChild(s1); s1.style.opacity = eo(P(t, 1.2, 1.8));
    const strike = el(`<div class="abs" style="left:44px;top:146px;height:4px;background:#e6a23c"></div>`); strike.style.width = 520 * eo(P(t, 3.2, 3.8)) + "px"; card.appendChild(strike);
    const s2 = el(`<div class="abs" style="left:44px;top:230px;right:44px"><div class="lab g">cross-check</div><div class="lede" style="margin-top:14px;color:#f2f2f2">improves the stops by 0.8 mm: within noise.<br>Left out.</div></div>`);
    card.appendChild(s2); s2.style.opacity = eo(P(t, 3.6, 4.2));
  },
  async close(t, d) {
    const p = eio(P(t, 0.2, 1.6));
    put(mark(840, 300, 80, 110, p));
    const a = line("Tether", "h1", 760, 430, { fontSize: "170px" }); rise(a, t, 0.9, 0.9);
    const u = line("github.com/men16922/tether", "lede", 766, 640, { fontFamily: "var(--f-m)", fontSize: "34px", color: "#f2f2f2" }); rise(u, t, 1.8);
    const s = line("NVIDIA Newton · Nemotron on Nebius Token Factory · NeMo Agent Toolkit", "lab", 766, 720, { fontSize: "24px" }); rise(s, t, 2.4);
  },
};

window.render = async function (name, t, d, fadeIn = 0.35, fadeOut = 0.35) {
  S.innerHTML = "";
  cur = document.createElement("div"); cur.className = "scene"; S.appendChild(cur);
  await SCENES[name](t, d);
  grain(t);
  cur.style.opacity = Math.min(eo(P(t, 0, fadeIn)), 1 - P(t, d - fadeOut, d));
  await Promise.all([...S.querySelectorAll("img")].map(i => i.complete ? null : i.decode().catch(() => {})));
  return true;
};
// every face the film uses, loaded before the first frame (a face first used mid-film would render blank for a moment)
window.ready = Promise.all(['700 100px "Barlow Semi Condensed"', '600 100px "Barlow Semi Condensed"', '500 100px "Barlow Semi Condensed"',

DATA.mug.path = k => `${DATA.mug.dir}/${String(k).padStart(6, "0")}.png`;
for (const key of ["road", "montage", "rollout"]) DATA[key].path = k => `${DATA[key].dir}/f${pad(k + 1)}.jpg`;
