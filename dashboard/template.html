      if (S.shown >= run.events.length) { stopReplay(); S.shown = null; render(); return; }
      S.shown += 1;
      const e = run.events[S.shown - 1];
      if (e.type === "measure") S.iter = e.iter;
      render();
      const tl = $("#tl"); if (tl) tl.scrollTop = tl.scrollHeight;
    }, 1300);
    render();
  }

  // ---------- render + events ----------
  function render() {
    renderTabs();
    S.v3 = null;
    $("#main").innerHTML = S.tab === "bench" ? renderBench() : S.tab === "gapbench" ? renderGapBench() : S.tab === "new" ? renderNew() : renderRun(B.runs[S.tab]);
    const slot = $("#v3slot");
    if (slot && S.v3) window.GCViewer.get().mount(slot, S.v3.replay, S.v3.key, { ...S.v3.meta, reveal: S.reveal });
  }

  // ---------- live: stump the agent ----------
  const OPEN_KEYS = ["patch_y0", "patch_mu", "lens_k"], STRIP_OFF = 0.999;
  const nominalForm = () => Object.fromEntries(Object.keys(P).map((k) => [k, P[k].nominal]));
  const moved = (f, k) => Math.abs(f[k] - P[k].nominal) > 1e-9;
  const muEff = (h) => ((h.object_mu ?? P.object_mu.nominal) + (h.table_mu ?? P.table_mu.nominal)) / 2;
  // the hidden world the server will run: changed params; a strip always carries its friction
  function hiddenOf(f) {
    const h = Object.fromEntries(Object.keys(P).filter((k) => moved(f, k)).map((k) => [k, +f[k]]));
    if (h.patch_y0 != null) h.patch_mu = +f.patch_mu; else delete h.patch_mu;
    return h;
  }
  const faultsOf = (h) => [...new Set(Object.keys(h).map((k) => (k === "patch_y0" || k === "patch_mu" ? "strip" : k)))];
  function describeHidden(h) {
    const parts = [];
    if (h.patch_y0 != null && h.patch_y0 < STRIP_OFF) {
      const pm = h.patch_mu ?? P.patch_mu.nominal, base = muEff(h);
      parts.push(`a ${pm < base ? "slick" : "rough"} strip from ${(+h.patch_y0).toFixed(2)} m (μ ${base.toFixed(2)} → ${(+pm).toFixed(2)})`);
    }
    if (h.lens_k != null) parts.push(`lens distortion k ${(+h.lens_k).toFixed(2)}/m`);
    Object.entries(h).filter(([k]) => !OPEN_KEYS.includes(k)).forEach(([k, v]) => parts.push(`${k} ${fmt(k, v)}`));
    return esc(parts.join(", "));
  }
  // top view of the push axis: where the strip lies relative to the targets
  function stripDiagram(f) {
    const W = 520, H = 56, L = 1, R = 1, X = 0.7, xs = (y) => L + (y / X) * (W - L - R);
    const on = f.patch_y0 < STRIP_OFF, base = muEff(f), col = f.patch_mu < base ? "#5b8fb3" : "#b3895b";
    let g = `<rect x="${xs(0)}" y="8" width="${xs(X) - xs(0)}" height="22" fill="#1a1a1a" stroke="#333"/>`;
    if (on) g += `<rect x="${xs(f.patch_y0)}" y="8" width="${xs(X) - xs(f.patch_y0)}" height="22" fill="${col}" fill-opacity="0.35"/><line x1="${xs(f.patch_y0)}" x2="${xs(f.patch_y0)}" y1="4" y2="34" stroke="${col}" stroke-width="2"/>`
      + `<text x="${(xs(f.patch_y0) + xs(X)) / 2}" y="23" text-anchor="middle" fill="#eee">μ ${(+f.patch_mu).toFixed(2)}</text>`;
    g += `<text x="${(xs(0) + xs(on ? f.patch_y0 : X)) / 2}" y="23" text-anchor="middle">μ ${base.toFixed(2)}</text>`;
    g += `<rect x="${xs(0.2)}" y="34" width="${xs(0.6) - xs(0.2)}" height="3" fill="#76b900"/><text x="${xs(0.4)}" y="50" text-anchor="middle">targets 0.20–0.60 m</text>`;
    g += `<text x="${xs(0)}" y="50">robot</text><text x="${xs(X)}" y="50" text-anchor="end">${X} m</text>`;
    return `<svg class="stripvis" viewBox="0 0 ${W} ${H}" role="img" aria-label="Table seen from above: friction strip position">${g}</svg>`;
  }
  function renderNew() {
    const f = (S.form ||= nominalForm());
    const hidden = hiddenOf(f), nF = faultsOf(hidden).length, max = LIVE.max_hidden, over = nF > max;
    const strip = f.patch_y0 < STRIP_OFF, muMax = LIVE.patch_mu_max || 0.95;
    const slider = (k, label, lo = P[k].low, hi = P[k].high, step = (P[k].high - P[k].low) / 100) =>
      `<div class="row ${moved(f, k) ? "moved" : ""}"><label class="nm" for="p-${k}">${label}</label>
        <input type="range" id="p-${k}" data-p="${k}" min="${lo}" max="${hi}" step="${step}" value="${f[k]}">
        <span class="mono val">${fmt(k, f[k])}</span></div>`;
    const presets = (LIVE.presets || []).map((p) => `<button class="btn" data-preset="${esc(p.id)}" aria-pressed="${S.preset === p.id}">${esc(p.title)}</button>`).join("")
      + `<button class="btn" data-surprise aria-pressed="${S.preset === "surprise"}">Surprise me</button><button class="btn ghost" id="reset">Reset</button>`;
    const tool = LIVE.agent === "tool";
    const closedKeys = Object.keys(P).filter((k) => !OPEN_KEYS.includes(k));
    return `<div class="scn"><div><span class="label">Stump the agent · live in NVIDIA Newton${LIVE.model ? " · " + esc(LIVE.model) : ""}</span><h2>Hide some physics. Watch ${tool ? "Nemotron" : "the agent"} find it.</h2>
        <p>Pick a preset or build a world, including faults the rule book has no parameter for. The agent trains a policy in its simulator, measures it in your hidden world, and repairs the simulator until the policy works. A run takes a few minutes.</p></div></div>
      <div class="presets" role="group" aria-label="Presets"><span class="label">Presets</span>${presets}</div>
      <div class="newgrid">
        <div class="faults">
          <section class="pane fault ${strip ? "on" : ""}"><header><label class="ftog"><input type="checkbox" data-strip ${strip ? "checked" : ""}> Friction strip</label><span class="label ow">open world</span></header>
            <div class="body"><p class="fd">Beyond a line on the table the friction changes (wet or rough). One friction number cannot describe it.</p>
              ${stripDiagram(f)}
              <div class="form">${strip ? slider("patch_y0", "strip starts", 0.25, 0.55, 0.01) + slider("patch_mu", "strip μ", 0.2, muMax, 0.01) : `<p class="note" style="margin:0">Off. Tick the box to add a strip.</p>`}</div></div></section>
          <section class="pane fault ${moved(f, "lens_k") ? "on" : ""}"><header><span class="ftog">Lens distortion</span><span class="label ow">open world</span></header>
            <div class="body"><p class="fd">The camera misjudges distance by k · d²: ${Math.abs(f.lens_k) < 1e-9 ? "with k &lt; 0 far targets look closer than they are, with k &gt; 0 farther" : `far targets look <b>${f.lens_k < 0 ? "closer" : "farther"}</b> than they are`}. Rules only know a shifted or tilted camera.</p>
              <div class="form">${slider("lens_k", "lens k", -0.3, 0.3, 0.01)}</div></div></section>
          <section class="pane fault"><header><span class="ftog">Closed-world parameters</span><span class="label">rule book knows these</span></header>
            <div class="body"><div class="form">${closedKeys.map((k) => slider(k, k)).join("")}</div>
              <p class="note">Density, size, restitution, light and camera height do not change the outcome: good tests of whether the agent blames the wrong thing.</p></div></section>
        </div>
        <aside class="side-col">
          <section class="pane agentview"><header><span class="label">How the agent sees it</span></header><div class="body">
            <p><b>It never sees the values you set.</b> Each iteration it gets only what a real robot would log:</p>
            <ul><li>20 real pushes: perceived target, command, where the cube stopped</li><li>camera tracks of each sliding cube</li><li>up to ${12} extra real pushes it may spend on its own experiments</li></ul>
            <p>${tool ? "Nemotron inspects the evidence, proposes simulator structures, fits them by least squares, probes the robot when the data cannot decide, and commits a simulator. The policy is retrained in it and measured again in your world." : "No LLM is configured on this server, so the rule-based diagnoser runs. It has no parameter for a strip or a lens and can only average them away."}</p>
          </div></section>
          <section class="pane runbox"><header><span class="label">Your hidden world · ${nF}/${max} faults</span></header><div class="body">
            <p class="hid">${nF ? describeHidden(hidden) : `<span style="color:var(--dim)">Nothing hidden yet: pick a preset or move a slider.</span>`}</p>
            <button class="btn primary big" id="go" ${!nF || over || LIVE.busy ? "disabled" : ""}>Run agent</button>
            <p class="note">${over ? `<span class="bad-t">Hide at most ${max} faults (a strip counts as one).</span> ` : ""}${S.err ? `<span class="bad-t">${esc(S.err)}</span> ` : ""}${LIVE.busy ? "Another run is in progress; watch it under Your worlds. " : ""}${tool ? `Up to ${LIVE.max_turns_per_run} agent turns per run · ${LIVE.llm_calls_left} LLM calls left on this server; past either, the rule-based diagnoser takes over.` : ""}</p>
          </div></section>
        </aside>
      </div>`;
  }
  function refreshStatus() {
    fetch("api/status").then((r) => r.json()).then((st) => { Object.assign(LIVE, st); renderFoot(); if (S.tab === "new") render(); }).catch(() => {});
  }
  function stream(run) {
    const es = new EventSource(`api/runs/${run.id}/events`);
    es.onmessage = (msg) => {
      const e = JSON.parse(msg.data);
      if (e.type === "start") { run.truth = e.truth; if (e.open != null) run.open = e.open; }
      else if (e.type === "agent_step") { if (run.pendingIter !== e.iter) { run.pending = []; run.pendingIter = e.iter; } run.pending.push(e.step); }
      else if (e.type === "end") { Object.assign(run, e.run, { events: run.events, title: run.title }); es.close(); LIVE.busy = false; refreshStatus(); }
      else if (e.type === "error") { run.error = e.message; es.close(); LIVE.busy = false; refreshStatus(); }
      else {
        run.events.push(e);
        if (e.type === "diagnose") { run.pending = null; run.pendingIter = null; }
        if (e.type === "measure" && B.runs[S.tab] === run) S.iter = null;
      }
      if (B.runs[S.tab] === run) { render(); const tl = $("#tl"); if (tl) tl.scrollTop = tl.scrollHeight; }
      else renderTabs();
    };
    es.onerror = () => { if (run.final_success == null && !run.error) { run.error = "Connection lost. Reload to see the finished run."; } es.close(); LIVE.busy = false; render(); };
  }
  async function startRun() {
    const hidden = hiddenOf(S.form), base = S.title || "Custom world";
    S.err = "";
    try {
      const r = await fetch("api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hidden, title: base }) });
      const data = await r.json();
      if (!r.ok) { S.err = typeof data.detail === "string" ? data.detail : "The run could not start."; render(); return; }
      const same = B.runs.filter((x) => isLive(x) && String(x.title).replace(/ #\d+$/, "") === base).length;
      const run = { id: data.id, title: same ? `${base} #${same + 1}` : base, hidden, events: [], truth: {}, baselines: null, final_success: null,
        open: data.open, agent: data.agent, pending: null };
      B.runs.push(run); LIVE.busy = true;
      S.tab = B.runs.length - 1; S.iter = null; S.shown = null; S.reveal = false;
      render(); stream(run);
    } catch (_) { S.err = "The server is not reachable."; render(); }
  }
  const setForm = (hidden, id, title) => { S.form = { ...nominalForm(), ...hidden }; S.preset = id; S.title = title; S.err = ""; render(); };
  $("#main").addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.p; if (!k) return;
    S.form[k] = +e.target.value;
    const val = e.target.parentElement.querySelector(".val"); if (val) val.textContent = fmt(k, S.form[k]);
  });
  $("#main").addEventListener("change", (e) => {
    const d = e.target.dataset || {};
    if (d.strip != null) {
      if (e.target.checked) { S.form.patch_y0 = 0.35; S.form.patch_mu = 0.4; } else { S.form.patch_y0 = P.patch_y0.nominal; S.form.patch_mu = P.patch_mu.nominal; }
    }
    if (d.p || d.strip != null) { S.preset = null; S.title = null; render(); }
  });
  $("#main").addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("#play")) { if (S.timer) { stopReplay(); render(); } else startReplay(); return; }
    if (t.closest("#end")) { stopReplay(); S.shown = null; S.iter = null; render(); return; }
    if (t.closest("#reveal") || t.closest("[data-reveal]")) { S.reveal = !S.reveal; render(); return; }
    if (t.closest("#go")) { startRun(); return; }
    if (t.closest("#reset")) { setForm({}, null, null); return; }
    const pb = t.closest("[data-preset]");
    if (pb) { const p = LIVE.presets.find((x) => x.id === pb.dataset.preset); if (p) setForm(p.hidden, p.id, p.title); return; }
    if (t.closest("[data-surprise]")) {
      fetch("api/surprise").then((r) => r.json()).then((w) => setForm(w.hidden, "surprise", w.title)).catch(() => { S.err = "The server is not reachable."; render(); });
      return;
    }
    const ib = t.closest("[data-iter]");
    if (ib) { S.iter = +ib.dataset.iter; render(); }
  });
  // deep link: #<run-id>[.s<steps shown>][.i<iteration>][.reveal][.split][.lane][.t<sec, e.g. t0_8>]  e.g. #weak-motor.s3.i0.reveal
  try {
    const [h, ...opts] = location.hash.slice(1).split(".");
    if (h === "new" && LIVE) S.tab = "new";
    else if (h === "benchmark") S.tab = "bench";
    else if (h === "gap-bench") S.tab = "gapbench";
    else { const i = B.runs.findIndex((r) => r.id === h); if (i >= 0) S.tab = i; }
    opts.forEach((o) => {
      if (/^s\d+$/.test(o)) S.shown = +o.slice(1);
      else if (/^i\d+$/.test(o)) S.iter = +o.slice(1);
      else if (o === "reveal") S.reveal = true;
      else if (/^t\d+(_\d+)?$/.test(o)) window.GC_V3_INIT = { ...(window.GC_V3_INIT || {}), t: +o.slice(1).replace("_", ".") };
      else if (o === "split" || o === "lane") window.GC_V3_INIT = { ...(window.GC_V3_INIT || {}), [o === "split" ? "mode" : "view"]: o };
    });
  } catch (_) {}
  render();
}
const EMPTY = { runs: [], benchmark: null, params: null, task: { name: "Push-to-line", n_targets: 20, success_tol_m: 0.03 }, stack: { physics: "NVIDIA Newton", diagnoser: "" }, generated: "" };
if (window.BUNDLE) boot(window.BUNDLE, null);
else Promise.all([
  fetch("api/bundle").then((r) => (r.ok ? r.json() : null)).catch(() => null),
  fetch("api/status").then((r) => r.json()).catch(() => null),
  fetch("api/runs").then((r) => (r.ok ? r.json() : [])).catch(() => []),
]).then(([b, st, past]) => {
  const B = b || EMPTY;
  if (!B.params && st) B.params = st.params;
  past.forEach((r, i) => B.runs.push({ ...r, title: r.title || `Custom #${i + 1}` }));
  boot(B, st);
});
})();
</script>
