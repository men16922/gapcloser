# The live run, with every Nemotron response saved so tests can replay it offline under NAT.
llms:
  nemotron:
    _type: openai
    base_url: https://api.tokenfactory.nebius.com/v1/
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.2

workflow:
  _type: tether_calibrate
  llm_name: nemotron
  record: integrations/nat_tether/recorded/lab-bench.json
